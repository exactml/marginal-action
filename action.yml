name: 'marginal review'
description: 'Post a marginal review on a PR, and its knowledge proposal once it merges'
author: 'exactml'
branding:
  icon: 'message-square'
  color: 'blue'

inputs:
  github-token:
    description: 'Token marginal uses to read the pull request and post the comment'
    required: true
  repo:
    description: 'GitHub repository as owner/name (default: the repository running this workflow)'
    required: false
    default: ''
  pr-number:
    description: 'Pull request number (default: the PR that triggered this workflow)'
    required: false
    default: ''
  marginal-version:
    description: 'marginal-review version to install, e.g. "0.1.0" (default: latest)'
    required: false
    default: ''
  python-version:
    description: 'Python version to run marginal with'
    required: false
    default: '3.11'
  anthropic-api-key:
    description: 'ANTHROPIC_API_KEY, required if .marginal/config.yaml configures models.reviewer with provider: anthropic'
    required: false
    default: ''
  openai-api-key:
    description: 'OPENAI_API_KEY, required if .marginal/config.yaml configures models.reviewer with provider: openai'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install marginal
      shell: bash
      env:
        MARGINAL_VERSION: ${{ inputs.marginal-version }}
      run: |
        if [ -z "$MARGINAL_VERSION" ]; then
          pip install "marginal-review[anthropic,openai]"
          exit 0
        fi
        # A pinned version also pins its dependencies, to the versions its release was tested with.
        constraints="$RUNNER_TEMP/marginal-constraints.txt"
        url="https://github.com/exactml/marginal/releases/download/v$MARGINAL_VERSION/constraints.txt"
        if curl -fsSL "$url" -o "$constraints"; then
          pip install "marginal-review[anthropic,openai]==$MARGINAL_VERSION" -c "$constraints"
        else
          echo "::warning::No constraints.txt for marginal-review $MARGINAL_VERSION (releases before it existed have none), so its dependencies are the newest versions."
          pip install "marginal-review[anthropic,openai]==$MARGINAL_VERSION"
        fi
        echo "::group::Installed packages"
        pip freeze
        echo "::endgroup::"

    - name: Post review comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        MARGINAL_REPO: ${{ inputs.repo || github.repository }}
        MARGINAL_PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        EVENT_ACTION: ${{ github.event.action }}
        MERGED: ${{ github.event.pull_request.merged }}
      run: |
        # A closed PR gets no review. Once merged, it posts the knowledge it
        # proposes (with proposals.enabled; otherwise propose does nothing).
        if [ "$EVENT_ACTION" = "closed" ]; then
          if [ "$MERGED" != "true" ]; then
            echo "::notice::Closed without merging: nothing to review or propose."
            exit 0
          fi
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::notice::A forked pull request's token is read-only, so marginal can't post its knowledge proposal -- skipping."
            exit 0
          fi
          if ! marginal propose --help >/dev/null 2>&1; then
            echo "::notice::This marginal-review has no propose command (added in 0.4.0) -- skipping."
            exit 0
          fi
          exec marginal propose --repo "$MARGINAL_REPO" --pr "$MARGINAL_PR_NUMBER" --comment
        fi

        set +e
        marginal review --repo "$MARGINAL_REPO" --pr "$MARGINAL_PR_NUMBER" --comment
        status=$?
        set -e

        # exit 3 is marginal-review's dedicated code for a configured
        # reviewer missing its credentials, distinct from the generic 1
        # used for every other failure -- only swallow *this* one.
        if [ "$status" -eq 3 ] && [ "$IS_FORK_PR" = "true" ]; then
          echo "::notice::marginal review needs provider credentials that forked pull requests never receive (GitHub doesn't forward secrets to them) -- skipping this review instead of failing the run."
          exit 0
        fi
        exit "$status"
