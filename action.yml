name: 'marginal review'
description: 'Post a marginal review summary as a PR comment'
author: 'exactml'
branding:
  icon: 'message-square'
  color: 'blue'

inputs:
  github-token:
    description: 'Token marginal uses to read the pull request and post the comment'
    required: true
  repo:
    description: 'GitHub repository as owner/name (default: the repository running this workflow)'
    required: false
    default: ''
  pr-number:
    description: 'Pull request number (default: the PR that triggered this workflow)'
    required: false
    default: ''
  marginal-version:
    description: 'marginal-review version to install, e.g. "0.1.0" (default: latest)'
    required: false
    default: ''
  python-version:
    description: 'Python version to run marginal with'
    required: false
    default: '3.11'
  anthropic-api-key:
    description: 'ANTHROPIC_API_KEY, required if .marginal/config.yaml configures models.reviewer with provider: anthropic'
    required: false
    default: ''
  openai-api-key:
    description: 'OPENAI_API_KEY, required if .marginal/config.yaml configures models.reviewer with provider: openai'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install marginal
      shell: bash
      run: |
        if [ -n "${{ inputs.marginal-version }}" ]; then
          pip install "marginal-review[anthropic,openai]==${{ inputs.marginal-version }}"
        else
          pip install "marginal-review[anthropic,openai]"
        fi

    - name: Post review comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        MARGINAL_REPO: ${{ inputs.repo || github.repository }}
        MARGINAL_PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        set +e
        marginal review --repo "$MARGINAL_REPO" --pr "$MARGINAL_PR_NUMBER" --comment
        status=$?
        set -e

        # exit 3 is marginal-review's dedicated code for a configured
        # reviewer missing its credentials, distinct from the generic 1
        # used for every other failure -- only swallow *this* one.
        if [ "$status" -eq 3 ] && [ "$IS_FORK_PR" = "true" ]; then
          echo "::notice::marginal review needs provider credentials that forked pull requests never receive (GitHub doesn't forward secrets to them) -- skipping this review instead of failing the run."
          exit 0
        fi
        exit "$status"
